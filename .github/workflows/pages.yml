name: Deploy SDroiMod Save Inspector to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['index.html','.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-save-inspector
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static local-only page
        run: |
          set -euo pipefail
          test -s index.html
          test "$(wc -c < index.html)" -lt 5242880
          python3 - <<'PYCODE'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert '<html lang="es-MX">' in s
          script=s.split('<script>',1)[1].split('</script>',1)[0]
          for forbidden in ('fetch(', 'XMLHttpRequest', 'sendBeacon', 'FormData(', 'WebSocket('):
              assert forbidden not in script, forbidden
          assert '20 * 1024 * 1024' in script
          for marker in ('slot0.player', 'SDMOD_ENC_V1:', 'ZIP64 no soportado'):
              assert marker in s, marker
          print('static page privacy/size checks passed')
          PYCODE
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
