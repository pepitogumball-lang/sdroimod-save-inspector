name: Test and deploy local save editor
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-save-editor
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Static safety checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert '<html lang="es-MX">' in s
          assert "connect-src 'none'" in s and "form-action 'none'" in s
          assert 'innerHTML' not in s and 'eval(' not in s
          assert 'SDMOD_ENC_V1:' in s and 'SDroiMod_MRSE_26' in s
          assert 'Recompilar y descargar .sdroimod' in s
          assert 'mini.sdroimod' not in s
          print('static safety checks passed')
          PY
      - name: Assemble clean Pages artifact
        run: |
          mkdir -p site
          cp index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
